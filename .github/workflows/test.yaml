name: test

on:
  push:
  pull_request:

jobs:
  nixos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: camdenboren
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix build .#checks.x86_64-linux.web

  nix-darwin:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: camdenboren
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix build .#checks.aarch64-darwin.web

      - name: Prepare nix-darwin activation
        run: |
          for file in /etc/bashrc /etc/zshrc /etc/zshenv /etc/bash.bashrc; do
            if [[ -e "$file" ]]; then
              sudo mv "$file" "$file.before-nix-darwin"
            fi
          done

      - name: Activate the test configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo env "NIX_CONFIG=access-tokens = github.com=$GH_TOKEN" \
            nix run github:nix-darwin/nix-darwin -- switch --flake '.#ci'

      - name: Run the testScript
        run: /run/current-system/sw/bin/testScript

  web:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with wasm target
        run: |
          rustup toolchain install nightly --profile minimal \
            --target wasm32-unknown-unknown --component rust-src

      - name: Install trunk
        continue-on-error: true
        run: cargo install trunk

      - name: Build
        run: trunk build

      - uses: cypress-io/github-action@v6
        with:
          working-directory: web
          start: npm run serve
          wait-on: http://127.0.0.1:8080/index.html
          wait-on-timeout: 120
          browser: electron
          command: npm run test:e2e
