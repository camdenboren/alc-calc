name: build

on:
  push:
    paths-ignore:
      - "**/README.md"
      - ".github/*.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
      - ".github/*.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libfontconfig-dev

      - name: Run Tests
        run: cargo test --verbose --release

      - name: Install cargo-bundle
        continue-on-error: true
        run: cargo install cargo-bundle

      - name: Build
        run: COL=80 ./script/bundle-linux

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: target/release/bundle/deb/alc-calc_*_amd64.deb

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Tests
        run: cargo test --verbose --release

      - name: Install Dependencies
        run: |
          brew install boxes create-dmg

      - name: Install cargo-bundle
        continue-on-error: true
        run: cargo install cargo-bundle

      - name: Build
        run: COL=80 DONT_SIGN=true ./script/bundle-mac

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: target/release/bundle/osx/alc-calc.dmg

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Tests
        run: cargo test --verbose --release

      - name: Install Dependencies
        run: choco install boxes.portable

      - name: Install cargo-packager
        continue-on-error: true
        run: cargo install cargo-packager

      - name: Build
        run: ./script/bundle-windows.ps1

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: target/release/alc-calc_*_x64-setup.exe

  nix-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: camdenboren
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix build

  nix-devShell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: camdenboren
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix develop

  nix-devShell-bundle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: camdenboren
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - run: nix develop .#bundle
