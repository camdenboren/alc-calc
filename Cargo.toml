[package]
name = "alc-calc"
version = "0.1.0"
edition = "2024"
authors = ["Camden Boren"]
description = "alc-calc is a GUI calculator for measuring alcoholic beverages by weight, not volume"

[dependencies]
strum = { version = "0.28.0", default-features = false }
strum_macros = { version = "0.28.0", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
toml = "1.1.5"
serde = { version = "1.0.229", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
rust-embed = { version = "8.12.0", default-features = false }
dirs = { version = "7.0.0", default-features = false }
gpui-unofficial = { version = "1.18.1", default-features = false, features = [
  "test-support",
  "windows-manifest",
] }
gpui-platform-gpui-unofficial = { version = "1.18.1", features = [
  "font-kit",
  "wayland",
  "x11",
] }
gpui-macros-gpui-unofficial = { version = "1.18.1", default-features = false }

[features]
runtime_shaders = ["gpui-platform-gpui-unofficial/runtime_shaders"]

[package.metadata.packager]
before-packaging-command = "cargo build --release"
icons = ["img/brand/app-icon.ico"]
resources = ["img/brand/app-icon.ico"]

[package.metadata.packager.nsis]
template = "os/installer.nsi"
installer-icon = "img/brand/app-icon.ico"

[package.metadata.bundle]
category = "Utility"
identifier = "io.github.camdenboren.alc-calc"
icon = ["img/brand/app-icon@2x.png", "img/brand/app-icon.png"]
